                fly();
            }
            lastTap = currentTime;

        function fly(){
            welcomeMsg.classList.add("welcomeMsgFly");
            emoji.textContent = '🤪';
            setTimeout(() => {

        function showMsg(){
            const systemDate = new Date();
            dateTxt.textContent = `${weekDays[systemDate.getDay()]}, ${months[systemDate.getMonth()]} ${systemDate.getDate()}, ${systemDate.getFullYear()}`;
            timeTxt.textContent = `${String(systemDate.getHours()).padStart(2,'0')}:${String(systemDate.getMinutes()).padStart(2, '0')}:${String(systemDate.getSeconds()).padStart(2, '0')}`;
            if(systemDate.getHours() >= 0 && systemDate.getHours() < 6){
                goodTxt.textContent = "Time To Sleep";
                emoji.textContent = "😪";
            }
            else if(systemDate.getHours() >= 6 && systemDate.getHours() < 11){
                goodTxt.textContent = "Good Morning";
                emoji.textContent = "😋";
            }
            else if(systemDate.getHours() >=11 && systemDate.getHours() < 14){
                goodTxt.textContent = "Good Noon";
                emoji.textContent = "😎";
            }
            else if(systemDate.getHours() >=14 && systemDate.getHours() < 20){
                goodTxt.textContent = "Good Evening";
                emoji.textContent = "😏";
            }
            else if(systemDate.getHours() >=20 && systemDate.getHours() < 24){
                goodTxt.textContent = "Good Night";
                emoji.textContent = "😴";
            }

        /* ---------- new logo (icon) assigning method ---------- */
        // Each app's icon is now found automatically instead of typing a FontAwesome

        // original FontAwesome icons were. A small table covers well-known brands that

        // generic category icon. You can still override any of it manually — either by
        // clicking a glyph from the picker in the Add/Edit popup, or by typing an exact
        // FontAwesome class, same as before, just no longer required.
        function normalizeUrl(url) {
            url = (url || '').trim();
            if (!url) return url;
            if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) url = 'https://' + url;
            return url;
        }
        function getDomain(url) {
            try { return new URL(normalizeUrl(url)).hostname.replace(/^www\./, ''); }
            catch (e) { return ''; }
        }
        function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
        function slugify(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
        function escapeAttr(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        const MULTI_PART_TLDS = new Set(['co.uk', 'com.tr', 'edu.tr', 'gov.tr', 'org.tr', 'co.jp', 'com.br', 'co.in', 'com.au', 'co.nz', 'com.cn', 'co.kr']);
        // Splits a hostname into { sub, brand }: e.g. "music.youtube.com" -> { sub: "music", brand: "youtube" }
        function domainParts(domain) {
            if (!domain) return { sub: '', brand: '' };
            const parts = domain.split('.');
            if (parts.length <= 1) return { sub: '', brand: parts[0] || '' };
            let tldLen = 1;
            if (parts.length >= 3 && MULTI_PART_TLDS.has(parts.slice(-2).join('.'))) tldLen = 2;
            const brandIdx = Math.max(parts.length - tldLen - 1, 0);
            const brand = parts[brandIdx] || '';
            const sub = brandIdx > 0 ? parts[0] : '';
            return { sub, brand };
        }
        function suggestName(domain) { return capitalize(domainParts(domain).brand); }

        // Simple Icons' full brand list (~3000 titles) is fetched once, lazily, and
        // searched locally — this is "platform 2", giving far broader brand coverage
        // than FontAwesome's free set (which only ships a few hundred brand marks).
        let simpleIconsIndex = null;
        let simpleIconsPromise = null;
        function loadSimpleIconsIndex() {
            if (simpleIconsIndex) return Promise.resolve(simpleIconsIndex);
            if (simpleIconsPromise) return simpleIconsPromise;
            simpleIconsPromise = fetch('https://cdn.jsdelivr.net/npm/simple-icons@latest/_data/simple-icons.json')
                .then(res => res.json())
                .then(data => {
                    simpleIconsIndex = data.map(d => ({ title: d.title, slug: slugify(d.title) }));
                    return simpleIconsIndex;
                })
                .catch(() => { simpleIconsIndex = []; return simpleIconsIndex; });
            return simpleIconsPromise;
        }

        // Human-readable label for a stored icon value, used next to the picker.
        function labelForIcon(value) {
            if (!value) return '';
            if (value.indexOf('si:') === 0) {
                const slug = value.slice(3);
                const found = simpleIconsIndex && simpleIconsIndex.find(e => e.slug === slug);
                return found ? found.title : slug;
            }
            const found = LOCAL_ICONS.find(e => e.cls === value);
            return found ? found.label : value;
        }

        function makeIconPickButton(previewNode, title, onClick) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'icon-pick';
            btn.title = title;
            btn.appendChild(previewNode);
            btn.addEventListener('click', onClick);
            return btn;
        }

        // Renders the live search-result grid inside the Add/Edit popup, searching
        // both the local FontAwesome index and (once loaded) the Simple Icons index.
        function renderIconPicker(gridEl, query, onPick) {
            gridEl.innerHTML = '';
            const q = query.trim().toLowerCase();

            if (!q) {
                ICON_PICKS.forEach(cls => {
                    const i = document.createElement('i');
                    i.className = cls;
                    gridEl.appendChild(makeIconPickButton(i, cls, () => onPick(cls)));
                });
                return;
            }

            const faMatches = LOCAL_ICONS.filter(entry =>
                entry.label.toLowerCase().includes(q) || entry.keywords.some(k => k.includes(q))
            ).slice(0, 24);
            faMatches.forEach(entry => {
                const i = document.createElement('i');
                i.className = entry.cls;
                gridEl.appendChild(makeIconPickButton(i, entry.label, () => onPick(entry.cls)));
            });

            const siPool = simpleIconsIndex || [];
            const siMatches = siPool.filter(entry => entry.title.toLowerCase().includes(q)).slice(0, 24);
            siMatches.forEach(entry => {
                const img = document.createElement('img');
                img.alt = '';
                img.src = simpleIconUrl(entry.slug);
                const value = 'si:' + entry.slug;
                const btn = makeIconPickButton(img, entry.title, () => onPick(value));
                img.onerror = () => btn.remove(); // a handful of titles slugify differently than the CDN expects
                gridEl.appendChild(btn);
            });

            if (!faMatches.length && !siMatches.length) {
                const empty = document.createElement('div');
                empty.className = 'icon-picker-empty';
                empty.textContent = simpleIconsIndex
                    ? 'No matching icon — you can still type an exact class, e.g. fa-solid fa-star'
                    : 'No local match yet — brand search is still loading…';
                gridEl.appendChild(empty);
            }
        }

        // Ordered candidates to try on Simple Icons, plus the FontAwesome class to
        // fall back to if none of them load.
        function autoIconCandidates(name, domain) {
            const { sub, brand } = domainParts(domain);
            const nameSlug = slugify(name);
            const brandSlug = slugify(brand);
            const combinedSlug = sub ? slugify(brand + sub) : '';
            const slugs = [...new Set([nameSlug, combinedSlug, brandSlug].filter(Boolean))];
            const key = [nameSlug, brandSlug].find(k => FA_BRAND_FALLBACK[k]);
            const fallbackClass = key ? FA_BRAND_FALLBACK[key] : (matchCategoryIcon(name, domain) || 'fa-solid fa-link');
            return { slugs, fallbackClass };
        }

        // Called from the inline onerror on each app tile's Simple Icons <img>
        function tryNextIcon(img) {
            let slugs = [];
            try { slugs = JSON.parse(img.dataset.slugs || '[]'); } catch (e) { slugs = []; }
            let attempt = parseInt(img.dataset.attempt, 10) || 0;
            attempt++;
            if (attempt < slugs.length) {
                img.dataset.attempt = String(attempt);
                img.src = simpleIconUrl(slugs[attempt]);
                return;
            }
            const i = document.createElement('i');
            i.className = (img.dataset.fallbackClass || 'fa-solid fa-link') + ' app-icon-glyph';
            img.replaceWith(i);
        }

        function renderAppIcon(appData) {
            if (appData.icon) {
                if (appData.icon.indexOf('si:') === 0) {
                    return `<img src="${simpleIconUrl(appData.icon.slice(3))}" alt="">`;
                }
                return `<i class="${escapeAttr(appData.icon)} app-icon-glyph"></i>`;
            }
            const domain = getDomain(appData.link);
            const { slugs, fallbackClass } = autoIconCandidates(appData.name, domain);
            if (slugs.length === 0) {
                return `<i class="${escapeAttr(fallbackClass)} app-icon-glyph"></i>`;
            }
            const slugsAttr = escapeAttr(JSON.stringify(slugs));
            const fallbackAttr = escapeAttr(fallbackClass);
            return `<img src="${simpleIconUrl(slugs[0])}" alt="" data-slugs='${slugsAttr}' data-attempt="0" data-fallback-class="${fallbackAttr}" onerror="tryNextIcon(this)">`;
        }

        // Same auto-detection, used for the live preview inside the Add/Edit popups.
        function renderIconPreview(previewEl, manualIcon, name, link) {
            previewEl.innerHTML = '';
            if (manualIcon) {
                if (manualIcon.indexOf('si:') === 0) {
                    const img = document.createElement('img');
                    img.alt = '';
                    img.src = simpleIconUrl(manualIcon.slice(3));
                    previewEl.appendChild(img);
                    return;
                }
                const i = document.createElement('i');
                i.className = manualIcon;
                previewEl.appendChild(i);
                return;
            }
            const domain = getDomain(link);
            const { slugs, fallbackClass } = autoIconCandidates(name, domain);
            tryPreviewIcon(previewEl, slugs, 0, fallbackClass);
        }
        function tryPreviewIcon(previewEl, slugs, attempt, fallbackClass) {
            if (attempt >= slugs.length) {
                previewEl.innerHTML = '';
                const i = document.createElement('i');
                i.className = fallbackClass;
                previewEl.appendChild(i);
                return;
            }
            const img = document.createElement('img');
            img.alt = '';
            img.src = simpleIconUrl(slugs[attempt]);
            img.onerror = () => tryPreviewIcon(previewEl, slugs, attempt + 1, fallbackClass);
            previewEl.innerHTML = '';
            previewEl.appendChild(img);
        }

        // Enables long press drag + insert
        function enableSwap(app, appsArray) {
            let holdTimer;
            let isDragging = false;
            let offsetX, offsetY;

            app.addEventListener('mousedown', startHold);
            app.addEventListener('touchstart', startHold, { passive: true });
            app.addEventListener('mouseup', cancelHold);
            app.addEventListener('mouseleave', cancelHold);
            app.addEventListener('touchend', cancelHold);

            function startHold(e) {
                if (e.type === 'touchstart') {
                    e.stopPropagation(); // Prevent scroll interference
                }
                holdTimer = setTimeout(() => {
                    isDragging = true;
                    app.classList.add('dragging');
                    app.style.position = 'absolute';
                    app.style.zIndex = '1000';
                    const rect = app.getBoundingClientRect();
                    // Center the app under the cursor
                    const clientX = e.clientX || e.touches[0].clientX;
                    const clientY = e.clientY || e.touches[0].clientY;
                    offsetX = rect.width / 2;
                    offsetY = rect.height / 2;
                    app.style.left = (clientX - offsetX) + 'px';
                    app.style.top = (clientY - offsetY) + 'px';

                    document.addEventListener('mousemove', moveAt);
                    document.addEventListener('mouseup', onDrop);
                    document.addEventListener('touchmove', moveAt, { passive: false });
                    document.addEventListener('touchend', onDrop);
                }, 500);
            }

            function moveAt(e) {
                e.preventDefault();
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                app.style.left = (clientX - offsetX) + 'px';
                app.style.top = (clientY - offsetY) + 'px';
            }

            function cancelHold(e) {
                clearTimeout(holdTimer);
                if (e.type === 'touchend' && !isDragging) {
                    // Allow single tap to open link on mobile
                    window.open(app.href, '_blank');
                }
            }

            function onDrop(e) {
                if (!isDragging) return;

                document.removeEventListener('mousemove', moveAt);
                document.removeEventListener('mouseup', onDrop);
                document.removeEventListener('touchmove', moveAt);
                document.removeEventListener('touchend', onDrop);

                app.style.position = '';
                app.style.zIndex = '';
                app.style.left = '';
                app.style.top = '';
                app.classList.remove('dragging');

                // Find the app under the drop position
                let clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
                let clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);
                app.style.display = 'none'; // Temporarily hide to avoid self-detection
                const target = document.elementFromPoint(clientX, clientY);
                app.style.display = '';

                const nearest = target.closest('.app-item');
                if (nearest && nearest !== app) {
                    let appIndex = +app.dataset.index;
                    let targetIndex = +nearest.dataset.index;

                    // Remove the dragged app from its original position
                    const [draggedApp] = appsArray.splice(appIndex, 1);
                    // Insert it at the target position
                    appsArray.splice(targetIndex, 0, draggedApp);

                    // Save to localStorage
                    localStorage.setItem('appOrder', JSON.stringify(appsArray));

                    // Refill UI
                    fillPage();
                }

                isDragging = false;
            }
        }

        function makeDraggable(element) {
            let offsetX = 0, offsetY = 0;

            // Function to handle the start of drag on both mouse and touch
            function dragStart(event) {
                event.preventDefault();

                // Check if it's a touch event
                const isTouchEvent = event.type === 'touchstart';

                // Calculate the initial offset
                if (isTouchEvent) {
                    offsetX = event.touches[0].clientX - element.getBoundingClientRect().left;
                    offsetY = event.touches[0].clientY - element.getBoundingClientRect().top;
                } else {
                    offsetX = event.clientX - element.getBoundingClientRect().left;
                    offsetY = event.clientY - element.getBoundingClientRect().top;
                }

                // Attach appropriate event listeners based on device type
                if (isTouchEvent) {
                    document.addEventListener('touchmove', drag);
                    document.addEventListener('touchend', dragEnd);
                } else {
                    document.addEventListener('mousemove', drag);
                    document.addEventListener('mouseup', dragEnd);
                }
            }

            // Function to handle the drag movement on both mouse and touch
            function drag(event) {
                event.preventDefault();

                const isTouchEvent = event.type === 'touchmove';
                const x = isTouchEvent ? event.touches[0].clientX - offsetX : event.clientX - offsetX;
                const y = isTouchEvent ? event.touches[0].clientY - offsetY : event.clientY - offsetY;

                // Apply the fixed position with new coordinates
                element.style.position = 'fixed';
                element.style.left = `${x}px`;
                element.style.top = `${y}px`;
            }

            // Function to handle the end of drag on both mouse and touch
            function dragEnd(event) {
                const isTouchEvent = event.type === 'touchend';

                if (isTouchEvent) {
                    document.removeEventListener('touchmove', drag);
                    document.removeEventListener('touchend', dragEnd);
                } else {
                    document.removeEventListener('mousemove', drag);
                    document.removeEventListener('mouseup', dragEnd);
                }
            }

            // Add event listeners for both mouse and touch start events
            element.addEventListener('mousedown', dragStart);
            element.addEventListener('touchstart', dragStart);
        }
